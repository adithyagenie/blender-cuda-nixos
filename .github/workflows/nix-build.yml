name: Nix Build

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.package }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: blender-with-cuda
            cache: adithyagenie
            cache_auth_secret: CACHIX_AUTH_TOKEN
          - package: blender-with-cuda-unstable
            cache: adithyagenie
            cache_auth_secret: CACHIX_AUTH_TOKEN
          - package: blender_5_3
            cache: blender-dlss
            cache_auth_secret: CACHIX_DLSS_AUTH_TOKEN
            extra_pull_names: adithyagenie
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
          extra_nix_config: |
            max-jobs = 1
            cores = 4
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-gha-cache: true
          use-flakehub: false
      - name: Install Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ matrix.cache }}
          authToken: ${{ secrets[matrix.cache_auth_secret] }}
          extraPullNames: ${{ matrix.extra_pull_names }}
          useDaemon: false
          pathsToPush: result
          cachixArgs: -j1
      - name: Build
        run: |
          set -euo pipefail
          nix build ".#${{ matrix.package }}" \
            --no-update-lock-file \
            --print-out-paths \
            --out-link result
